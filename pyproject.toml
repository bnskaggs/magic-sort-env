[project]
name = "magic-sort-env"
version = "0.1.1"
description = "A Magic Sort / water-sort RL environment with solver-verified par, exploit-aware rewards, and partial-information variants."
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = { text = "MIT" }
authors = [{ name = "bnskaggs" }]
dependencies = [
    "datasets>=5.0.0",
    "verifiers>=0.3.1",
    # This env never uses sandboxes, but verifiers imports prime_sandboxes
    # eagerly. 0.3.0 added a hard reject when a legacy connect-python package
    # is present, which killed the hosted env-server on 2026-09-17 (run
    # w7ef3ieinada4h9ai1heeiwf) because the training base image ships it.
    # 0.2.x coexists fine. Drop this pin when the platform image is clean.
    "prime-sandboxes>=0.2.42,<0.3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/magic_sort_env"]
include = ["src/magic_sort.py"]

[tool.hatch.build.targets.sdist]
include = [
    "src/",
    "tests/",
    "README.md",
    "DESIGN.md",
    "LICENSE",
    "pyproject.toml",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.verifiers.eval]
num_examples = 5
rollouts_per_example = 2
