[project]
name = "magic-sort-env"
version = "0.1.3"
description = "A Magic Sort / water-sort RL environment with solver-verified par, exploit-aware rewards, and partial-information variants."
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = { text = "MIT" }
authors = [{ name = "bnskaggs" }]
dependencies = [
    # verifiers is deliberately NOT declared, despite being a hard runtime
    # import. Hosted training installs this wheel into a shared image whose
    # harness runs verifiers==0.2.2.dev6, and any dependency that upgrades
    # verifiers or prime-sandboxes breaks that harness (three $0 failed runs
    # on 2026-09-17/18: the connect-python guard fires for any
    # prime-sandboxes>=0.2.39, and verifiers==0.3.0 renames EnvServerConfig
    # out from under the harness). The wheel must be a pure plugin over the
    # runtime's own stack. Tests pass on both verifiers==0.2.2.dev6 (image)
    # and verifiers==0.3.0 (local, via the dev extra). datasets stays
    # unversioned for the same reason: any installed version satisfies it.
    "datasets",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "verifiers>=0.3.0,<0.3.1",
    "prime-sandboxes>=0.2.35,<0.2.39",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/magic_sort_env"]
include = ["src/magic_sort.py"]

[tool.hatch.build.targets.sdist]
include = [
    "src/",
    "tests/",
    "README.md",
    "DESIGN.md",
    "LICENSE",
    "pyproject.toml",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.verifiers.eval]
num_examples = 5
rollouts_per_example = 2
