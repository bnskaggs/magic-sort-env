# Curriculum run 2: warm-start from the trivial-trained step-45 checkpoint
# and train on easy (4 colors - never seen during run 1).
# Gate already measured (2026-09-18 transfer test): the step-45 adapter
# scores 0.730 avg on the easy eval split - mid-band. Base 9B scores 0.410.
# Dual-tier eval: easy tracks learning, trivial tracks forgetting.
#
# GOTCHA (measured the hard way, $3.87): max_steps is ABSOLUTE, not
# incremental - a warm-start from a step-45 checkpoint resumes the counter at
# 46, so max_steps = 50 trained only 5 steps (run p2wvhe7t5s1sa3gu234kmn35;
# those 5 steps did move easy train reward 1.52 -> 1.71). max_steps = 75
# below means 30 new steps on top of the checkpoint's 45.
# Budget: ~$0.77/step measured on easy -> ~$23 for 30 steps.

model = "Qwen/Qwen3.5-9B"
checkpoint_id = "t3xlw91ycjc1abzxce1pwt34"
max_steps = 75
batch_size = 64
rollouts_per_example = 8

[sampling]
max_tokens = 400
enable_thinking = false

[[env]]
id = "bnskaggs/magic-sort-env"
args = { tier = "easy" }

[checkpoints]
interval = 10

[eval]
interval = 10
num_examples = 20
rollouts_per_example = 2

[eval.sampling]
max_tokens = 400
temperature = 0.0
enable_thinking = false

[[eval.env]]
name = "easy"
id = "bnskaggs/magic-sort-env"
args = { tier = "easy" }

[[eval.env]]
name = "trivial"
id = "bnskaggs/magic-sort-env"
args = { tier = "trivial" }
